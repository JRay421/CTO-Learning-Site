<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#fff;
    font-family:Montserrat,Arial,sans-serif;
}

/* Container */

.employee-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;

    max-width:900px;
    margin:auto;
}

/* Cards */

.employee-card{
    width:200px;
    background:#fff;
    border:1px solid #D6E4D8;
    border-radius:16px;
    overflow:hidden;
    box-shadow:
    0 5px 15px rgba(0,0,0,.08);
    transition:.3s;
}

.employee-card:hover{
    transform:translateY(-6px);
    box-shadow:
    0 14px 28px rgba(0,0,0,.15);
}

/* Window image */

.employee-photo-wrapper{
    height:220px;
    overflow:hidden;
    background:#E8ECF4;
}

.employee-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    transition:.4s;
}

.employee-card:hover .employee-photo{
    transform:scale(1.05);
}

/* Text */

.employee-info{
    padding:14px 12px 18px;
    text-align:center;
}

.employee-name{
    margin:0 0 6px;
    color:#204594;
    font-size:18px;
    font-weight:700;
}

.employee-title{
    margin:0;
    color:#666;
    font-size:12px;
    line-height:1.4;
}

/* Tablet */

@media(max-width:800px){
.employee-card{
    width:220px;
}

}

/* Phone */

@media(max-width:600px){
.employee-card{
    width:100%;
    max-width:320px;
}

}
</style>
</head>

<body>

<div class="employee-grid">

<div class="employee-card">

<div class="employee-photo-wrapper">
<img class="employee-photo"
src="images/Jeannie.jpg"
alt="Jeannie Stone">
</div>

<div class="employee-info">
<h2 class="employee-name">Jeannie Stone</h2>
<p class="employee-title">Superintendent in Residence</p>
</div>

</div>


<div class="employee-card">

<div class="employee-photo-wrapper">
<img class="employee-photo"
src="images/Chelsea.jpg"
alt="Chelsea Valdez">
</div>

<div class="employee-info">
<h2 class="employee-name">Chelsea Valdez</h2>
<p class="employee-title">Managing Director, Educator Development</p>
</div>

</div>


<div class="employee-card">

<div class="employee-photo-wrapper">
<img class="employee-photo"
src="images/Laura.jpg"
alt="Laura Vargas">
</div>

<div class="employee-info">
<h2 class="employee-name">Laura Vargas</h2>
<p class="employee-title">Director, Special Assistant to the Chiefs</p>
</div>

</div>


<div class="employee-card">

<div class="employee-photo-wrapper">
<img class="employee-photo"
src="images/Jasmine.jpg"
alt="Jasmine Ray">
</div>

<div class="employee-info">
<h2 class="employee-name">Jasmine Ray</h2>
<p class="employee-title">Statewide, Engagement &amp; Activation Associate</p>
</div>

</div>


<div class="employee-card">

<div class="employee-photo-wrapper">
<img class="employee-photo"
src="images/Izzy.jpg"
alt="Isabelle Nogoy">
</div>

<div class="employee-info">
<h2 class="employee-name">Isabelle Nogoy</h2>
<p class="employee-title">Associate, Educator Development</p>
</div>

</div>

</div>

</body>
</html>
